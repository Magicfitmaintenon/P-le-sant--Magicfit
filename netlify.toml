# Version "à plat" : tous les fichiers à la racine du dépôt, sans dossier
[build]
  publish = "."
  functions = "."
  command = "echo 'Site RDV InBody'"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Referrer-Policy = "same-origin"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/accueil.html"
  [headers.values]
    X-Robots-Tag = "noindex"

# Ne pas servir le code et la config comme pages
[[redirects]]
  from = "/api.mjs"
  to = "/"
  status = 404
  force = true
[[redirects]]
  from = "/package.json"
  to = "/"
  status = 404
  force = true
[[redirects]]
  from = "/netlify.toml"
  to = "/"
  status = 404
  force = true
